<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3b1033">
<title>Pricing Agent · Seller app prototype</title>
<link rel="icon" href="/static/logo.webp">
<style>
:root {
  --bg: #f8f4f1;
  --card: #ffffff;
  --ink: #1e1420;
  --ink-2: #5a4f5c;
  --muted: #9a8f9b;
  --line: #efe8e5;
  --plum: #3b1033;
  --plum-2: #57204c;
  --pink: #d6246e;
  --pink-2: #b81c5d;
  --pink-soft: #fdeef4;
  --green: #0f8a4f;
  --green-soft: #e7f5ed;
  --amber: #b86e00;
  --amber-soft: #fff3de;
  --red: #c8352b;
  --red-soft: #fdecea;
  --shadow: 0 1px 2px rgba(40, 14, 34, .04), 0 10px 30px rgba(40, 14, 34, .06);
  --r: 20px;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", "Noto Sans", "Noto Sans Devanagari", Arial, sans-serif;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 16px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
b { font-weight: 650; }
.tnum { font-variant-numeric: tabular-nums; }
svg.i { width: 20px; height: 20px; flex: 0 0 auto; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* ------------------------------------------------ shell */
.app { max-width: 560px; margin: 0 auto; min-height: 100vh; padding: 0 16px calc(96px + env(safe-area-inset-bottom)); }
.top { position: sticky; top: 0; z-index: 20; background: rgba(248, 244, 241, .9); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 0; margin: 0 -16px; padding-left: 16px; padding-right: 16px; }
.brand { display: flex; align-items: center; gap: 9px; font-weight: 700; letter-spacing: -.01em; }
.brand img { width: 30px; height: 30px; border-radius: 8px; }
.brand small { display: block; font-weight: 500; font-size: .7rem; color: var(--muted); letter-spacing: 0; }
.seller-chip { position: relative; display: flex; align-items: center; gap: 8px; background: var(--card); border-radius: 999px; padding: 4px 12px 4px 4px; box-shadow: var(--shadow); max-width: 58%; }
.avatar { width: 30px; height: 30px; border-radius: 50%; background: var(--plum); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: .78rem; flex: 0 0 auto; }
.seller-chip span { font-size: .86rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.seller-chip select { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; }
.proto-note { font-size: .74rem; color: var(--muted); text-align: center; margin: 4px 0 14px; }
.proto-note a { color: var(--pink); }

.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; display: flex; justify-content: center; padding: 8px 12px calc(10px + env(safe-area-inset-bottom)); pointer-events: none; }
.nav-inner { pointer-events: auto; display: flex; gap: 4px; background: var(--card); border-radius: 22px; padding: 6px; box-shadow: 0 10px 40px rgba(40, 14, 34, .16); }
.nav button { border: 0; background: none; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 18px; border-radius: 16px; font-size: .72rem; font-weight: 600; color: var(--muted); cursor: pointer; min-width: 88px; }
.nav button.on { background: var(--pink-soft); color: var(--pink); }
.nav button.new { background: var(--pink); color: #fff; }
.nav button.new.on { background: var(--pink-2); }

/* ------------------------------------------------ type */
h1 { font-size: 1.7rem; line-height: 1.15; letter-spacing: -.025em; margin: 8px 0 4px; font-weight: 750; }
h2 { font-size: 1.1rem; letter-spacing: -.01em; margin: 26px 0 10px; font-weight: 700; display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
h2 small { font-size: .8rem; font-weight: 500; color: var(--muted); }
.sub { color: var(--ink-2); margin: 0 0 16px; }
.muted { color: var(--muted); }

/* ------------------------------------------------ cards */
.card { background: var(--card); border-radius: var(--r); box-shadow: var(--shadow); padding: 18px; }
.money { position: relative; overflow: hidden; background: var(--plum); color: #fff; border-radius: 24px; padding: 22px; box-shadow: 0 14px 40px rgba(59, 16, 51, .28); }
.money::after { content: ""; position: absolute; inset: 0; opacity: .12; pointer-events: none;
  background-image: radial-gradient(circle at 12px 12px, #fff 2.2px, transparent 2.6px), radial-gradient(circle at 0 0, transparent 7px, #fff 7.5px, #fff 8.6px, transparent 9px);
  background-size: 24px 24px, 24px 24px; mask-image: linear-gradient(115deg, transparent 35%, #000 100%); -webkit-mask-image: linear-gradient(115deg, transparent 35%, #000 100%); }
.money .k { font-size: .82rem; opacity: .8; }
.money .v { font-size: 2.6rem; font-weight: 800; letter-spacing: -.03em; line-height: 1.05; margin: 4px 0 6px; font-variant-numeric: tabular-nums; }
.money .d { font-size: .92rem; opacity: .9; max-width: 330px; }
.progress { margin-top: 16px; height: 8px; background: rgba(255, 255, 255, .16); border-radius: 99px; overflow: hidden; }
.progress i { display: block; height: 100%; background: #ff8fbf; border-radius: 99px; transition: width .5s ease; }
.progress-k { font-size: .78rem; opacity: .8; margin-top: 7px; }

.pulse { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 12px; }
.pulse .card { padding: 12px 14px; border-radius: 16px; }
.pulse .v { font-size: 1.15rem; font-weight: 750; font-variant-numeric: tabular-nums; }
.pulse .k { font-size: .72rem; color: var(--muted); }

/* ------------------------------------------------ action cards */
.todo { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; }
.act { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 14px; transition: opacity .3s, transform .3s; }
.act.done { opacity: .55; }
.thumb { width: 64px; height: 76px; border-radius: 14px; background: #f3eeea; display: grid; place-items: center; position: relative; overflow: hidden; }
.thumb svg { width: 50px; height: 62px; }
.thumb .n { position: absolute; bottom: 4px; right: 4px; background: rgba(255,255,255,.92); color: var(--ink); font-size: .62rem; font-weight: 700; padding: 1px 5px; border-radius: 6px; }
.act .meta { font-size: .76rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.act .title { font-weight: 750; font-size: 1.08rem; letter-spacing: -.01em; margin: 2px 0 4px; display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
.verb { display: inline-flex; align-items: center; gap: 4px; }
.verb.up { color: var(--green); } .verb.down { color: var(--amber); } .verb.old { color: var(--red); } .verb.hold { color: var(--ink-2); }
.pp { font-size: .82rem; color: var(--ink-2); font-weight: 500; }
.pp s { color: var(--muted); }
.why1 { font-size: .86rem; color: var(--ink-2); margin: 0 0 10px; }
.gain { display: inline-block; font-size: .78rem; font-weight: 700; padding: 3px 8px; border-radius: 8px; background: var(--green-soft); color: var(--green); margin-bottom: 10px; }
.gain.neg { background: var(--amber-soft); color: var(--amber); }
.btns { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.btn { border: 0; border-radius: 12px; padding: 10px 16px; font-weight: 700; font-size: .9rem; cursor: pointer; display: inline-flex; align-items: center; gap: 7px; }
.btn.primary { background: var(--pink); color: #fff; }
.btn.primary:hover { background: var(--pink-2); }
.btn.dark { background: var(--plum); color: #fff; }
.btn.ghost { background: #f4eeec; color: var(--ink); }
.btn.ghost:hover { background: #ece4e1; }
.btn.link { background: none; color: var(--pink); padding: 10px 6px; }
.btn.danger { background: var(--red-soft); color: var(--red); }
.btn.block { width: 100%; justify-content: center; padding: 15px; font-size: 1rem; border-radius: 16px; }
.btn:disabled { opacity: .5; cursor: default; }
.done-tag { display: inline-flex; align-items: center; gap: 6px; color: var(--green); font-weight: 700; font-size: .9rem; }

.allset { text-align: center; padding: 30px 18px; }
.allset .big { font-size: 1.2rem; font-weight: 750; margin: 8px 0 4px; }

/* ------------------------------------------------ shelf (my kurtis) */
.search { display: flex; align-items: center; gap: 8px; background: var(--card); border-radius: 14px; padding: 0 14px; box-shadow: var(--shadow); }
.search input { border: 0; outline: 0; background: none; padding: 13px 0; width: 100%; font-size: .95rem; }
.chips { display: flex; gap: 8px; overflow-x: auto; padding: 12px 0 4px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 7px 14px; font-size: .84rem; font-weight: 600; white-space: nowrap; cursor: pointer; color: var(--ink-2); }
.chip.on { background: var(--ink); border-color: var(--ink); color: #fff; }
.shelf { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-top: 10px; }
.item { padding: 0; overflow: hidden; cursor: pointer; text-align: left; border: 0; display: flex; flex-direction: column; justify-content: flex-start; align-items: stretch; width: 100%; }
.item .pic { height: 132px; display: grid; place-items: center; position: relative; width: 100%; }
.item .pic svg { width: 82px; height: 102px; filter: drop-shadow(0 6px 10px rgba(0,0,0,.08)); }
.item .flag { position: absolute; top: 10px; left: 10px; font-size: .68rem; font-weight: 700; padding: 3px 8px; border-radius: 8px; background: rgba(255,255,255,.94); }
.flag.up { color: var(--green); } .flag.down { color: var(--amber); } .flag.old { color: var(--red); } .flag.new { color: var(--pink); } .flag.hold { color: var(--ink-2); }
.item .body { padding: 12px 14px 14px; }
.item .name { font-weight: 650; font-size: .88rem; line-height: 1.3; height: 2.6em; overflow: hidden; }
.item .price { font-weight: 800; font-size: 1.1rem; margin-top: 6px; font-variant-numeric: tabular-nums; }
.item .sold { font-size: .74rem; color: var(--muted); }
.stockbar { height: 5px; background: #f1ebe8; border-radius: 9px; margin-top: 9px; overflow: hidden; }
.stockbar i { display: block; height: 100%; border-radius: 9px; }
.item .stockk { font-size: .7rem; color: var(--muted); margin-top: 4px; }

/* ------------------------------------------------ sheet */
.scrim { position: fixed; inset: 0; background: rgba(30, 10, 25, .38); z-index: 40; opacity: 0; transition: opacity .2s; }
.scrim.on { opacity: 1; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 41; max-width: 560px; margin: 0 auto; background: var(--card); border-radius: 26px 26px 0 0;
  max-height: 88vh; overflow-y: auto; padding: 10px 20px calc(24px + env(safe-area-inset-bottom)); transform: translateY(100%); transition: transform .28s cubic-bezier(.2, .8, .2, 1); }
.sheet.on { transform: translateY(0); }
.grab { width: 40px; height: 5px; border-radius: 9px; background: #e5dcd9; margin: 0 auto 14px; }
.sheet h3 { margin: 0; font-size: 1.2rem; letter-spacing: -.015em; }
.facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 14px 0; }
.fact { background: #faf6f4; border-radius: 14px; padding: 10px 12px; }
.fact .v { font-weight: 750; font-variant-numeric: tabular-nums; }
.fact .k { font-size: .7rem; color: var(--muted); }
.reasons { display: grid; gap: 10px; margin: 12px 0 18px; }
.reason { display: grid; grid-template-columns: 34px 1fr; gap: 10px; align-items: start; }
.reason .ic { width: 34px; height: 34px; border-radius: 11px; display: grid; place-items: center; background: #f6f0ee; color: var(--ink-2); }
.reason .ic.positive { background: var(--green-soft); color: var(--green); }
.reason .ic.negative { background: var(--red-soft); color: var(--red); }
.reason .t { font-size: .84rem; font-weight: 700; }
.reason .x { font-size: .9rem; color: var(--ink-2); }
.ai-note { display: inline-flex; align-items: center; gap: 5px; font-size: .74rem; font-weight: 600; color: var(--pink); }
.summary-box { background: var(--pink-soft); border-radius: 14px; padding: 12px 14px; font-size: .92rem; margin: 10px 0 0; }

/* ------------------------------------------------ wizard */
.steps { display: flex; gap: 6px; margin: 8px 0 18px; }
.steps i { flex: 1; height: 5px; border-radius: 9px; background: #eae2df; }
.steps i.on { background: var(--pink); }
.q { font-size: 1.45rem; font-weight: 750; letter-spacing: -.02em; line-height: 1.2; margin: 0 0 6px; }
.field { margin: 0 0 14px; }
.field > label, .lbl { display: block; font-size: .84rem; font-weight: 650; margin: 0 0 7px; color: var(--ink); }
.field .hint { font-size: .78rem; color: var(--muted); margin-top: 6px; }
.in { width: 100%; border: 1.5px solid #ece4e1; background: var(--card); border-radius: 14px; padding: 13px 14px; font-size: 1rem; outline: none; transition: border-color .15s; }
.in:focus { border-color: var(--pink); }
textarea.in { resize: vertical; min-height: 84px; }
.money-in { display: flex; align-items: center; border: 1.5px solid #ece4e1; background: var(--card); border-radius: 16px; padding: 0 16px; }
.money-in:focus-within { border-color: var(--pink); }
.money-in span { font-size: 1.4rem; font-weight: 700; color: var(--muted); }
.money-in input { border: 0; outline: 0; background: none; font-size: 1.6rem; font-weight: 750; padding: 12px 8px; width: 100%; font-variant-numeric: tabular-nums; }
.stepper { display: flex; align-items: center; gap: 0; border: 1.5px solid #ece4e1; background: var(--card); border-radius: 16px; overflow: hidden; }
.stepper button { border: 0; background: #faf6f4; width: 56px; height: 58px; font-size: 1.5rem; cursor: pointer; color: var(--ink-2); }
.stepper input { border: 0; outline: 0; text-align: center; font-size: 1.5rem; font-weight: 750; width: 100%; background: none; font-variant-numeric: tabular-nums; }
.photos { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 16px; }
.ph { aspect-ratio: 3 / 4; border-radius: 14px; background: #f3ede9; display: grid; place-items: center; overflow: hidden; position: relative; }
.ph img { width: 100%; height: 100%; object-fit: cover; }
.ph.add { border: 1.5px dashed #dccfcb; background: var(--card); cursor: pointer; color: var(--pink); flex-direction: column; font-size: .72rem; font-weight: 700; gap: 4px; }
.ph.add input { display: none; }
.spotted { display: flex; flex-wrap: wrap; gap: 8px; }
.pick { position: relative; display: inline-flex; align-items: center; gap: 6px; background: var(--card); border: 1.5px solid #ece4e1; border-radius: 12px; padding: 8px 12px; font-size: .86rem; font-weight: 650; }
.pick small { color: var(--muted); font-weight: 500; font-size: .72rem; display: block; line-height: 1.1; }
.pick.auto { border-color: #f4bcd3; background: var(--pink-soft); }
.pick select { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; border: 1.5px solid #ece4e1; background: var(--card); border-radius: 14px; padding: 8px; }
.tag { display: inline-flex; align-items: center; gap: 6px; background: #f6f0ee; border-radius: 9px; padding: 5px 6px 5px 8px; font-size: .84rem; font-weight: 600; }
.tag .sw { width: 12px; height: 12px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(0,0,0,.15); }
.tag button { border: 0; background: none; cursor: pointer; color: var(--muted); font-size: 1rem; line-height: 1; padding: 0 2px; }
.tags input { border: 0; outline: 0; flex: 1; min-width: 120px; padding: 5px; background: none; }
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.seg button { border: 1.5px solid #ece4e1; background: var(--card); border-radius: 14px; padding: 12px; font-weight: 650; cursor: pointer; }
.seg button.on { border-color: var(--pink); background: var(--pink-soft); color: var(--pink); }
.toggle-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); }
.switch { position: relative; width: 48px; height: 28px; flex: 0 0 auto; }
.switch input { opacity: 0; width: 0; height: 0; }
.switch span { position: absolute; inset: 0; background: #e5dcd9; border-radius: 99px; transition: background .2s; cursor: pointer; }
.switch span::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; background: #fff; border-radius: 50%; box-shadow: 0 1px 3px rgba(0,0,0,.2); transition: transform .2s; }
.switch input:checked + span { background: var(--pink); }
.switch input:checked + span::after { transform: translateX(20px); }
.goals { display: grid; gap: 10px; }
.goal { display: grid; grid-template-columns: 48px 1fr; gap: 14px; align-items: center; text-align: left; border: 2px solid transparent; background: var(--card); border-radius: 18px; padding: 14px; box-shadow: var(--shadow); cursor: pointer; }
.goal.on { border-color: var(--pink); }
.goal .gi { width: 48px; height: 48px; border-radius: 14px; background: #f6f0ee; display: grid; place-items: center; color: var(--plum); }
.goal.on .gi { background: var(--pink); color: #fff; }
.goal b { display: block; font-size: 1rem; }
.goal span { font-size: .84rem; color: var(--ink-2); }
.goal .rec { display: inline-block; font-size: .66rem; font-weight: 700; color: var(--pink); background: var(--pink-soft); border-radius: 6px; padding: 1px 6px; margin-left: 6px; vertical-align: 2px; }
.wiz-foot { position: sticky; bottom: calc(84px + env(safe-area-inset-bottom)); padding: 14px 0 6px; display: flex; gap: 10px; background: linear-gradient(rgba(248,244,241,0), var(--bg) 22px); margin-top: 12px; }
.result-foot { position: sticky; bottom: calc(84px + env(safe-area-inset-bottom)); margin-top: 18px; padding: 10px 0 4px; background: linear-gradient(rgba(248,244,241,0), var(--bg) 16px); }
.result-foot .btn.block { box-shadow: 0 8px 24px rgba(214, 36, 110, .28); }
.wiz-foot .btn.block { flex: 1; }
.err { background: var(--red-soft); color: var(--red); border-radius: 12px; padding: 10px 14px; font-size: .88rem; margin: 0 0 12px; }

/* ------------------------------------------------ thinking screen */
.thinking { text-align: center; padding: 60px 10px 20px; }
.orb { width: 92px; height: 92px; border-radius: 50%; margin: 0 auto 24px; background: conic-gradient(from 0deg, var(--pink), #ff9ac3, var(--plum), var(--pink)); animation: spin 1.6s linear infinite; position: relative; }
.orb::after { content: ""; position: absolute; inset: 8px; border-radius: 50%; background: var(--bg); }
@keyframes spin { to { transform: rotate(360deg); } }
.think-steps { list-style: none; padding: 0; margin: 0 auto; max-width: 300px; text-align: left; display: grid; gap: 10px; }
.think-steps li { display: flex; gap: 10px; align-items: center; color: var(--muted); font-size: .92rem; transition: color .3s; }
.think-steps li.on { color: var(--ink); font-weight: 600; }
.think-steps li.ok { color: var(--green); }
.dot { width: 20px; height: 20px; border-radius: 50%; border: 2px solid currentColor; display: grid; place-items: center; flex: 0 0 auto; font-size: .7rem; }

/* ------------------------------------------------ result */
.price-hero { text-align: center; padding: 24px 18px 20px; }
.price-hero .k { font-size: .82rem; color: var(--muted); font-weight: 600; letter-spacing: .02em; }
.price-hero .p { font-size: 4rem; font-weight: 850; letter-spacing: -.04em; line-height: 1; margin: 6px 0; font-variant-numeric: tabular-nums; }
.price-hero .mrp { color: var(--muted); font-size: .92rem; }
.price-hero .mrp b { color: var(--green); }
.verdict { display: inline-flex; align-items: center; gap: 6px; margin-top: 12px; font-size: .84rem; font-weight: 700; padding: 6px 12px; border-radius: 99px; background: var(--green-soft); color: var(--green); }
.headline { font-size: 1rem; color: var(--ink-2); margin: 14px auto 0; max-width: 420px; }
.trio { display: grid; grid-template-columns: repeat(3, 1fr); border-top: 1px solid var(--line); margin: 18px -18px -20px; }
.trio > div { padding: 14px 8px; text-align: center; border-left: 1px solid var(--line); }
.trio > div:first-child { border-left: 0; }
.trio .v { font-weight: 800; font-size: 1.15rem; font-variant-numeric: tabular-nums; }
.trio .k { font-size: .7rem; color: var(--muted); }
.try .readout { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; align-items: end; margin-bottom: 8px; }
.try .tp { font-size: 2.1rem; font-weight: 850; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.zone { justify-self: end; font-size: .78rem; font-weight: 700; padding: 5px 10px; border-radius: 99px; }
.zone.good { background: var(--green-soft); color: var(--green); }
.zone.warn { background: var(--amber-soft); color: var(--amber); }
.zone.bad { background: var(--red-soft); color: var(--red); }
.curve { width: 100%; height: 86px; display: block; }
input[type=range].slider { -webkit-appearance: none; appearance: none; width: 100%; height: 34px; background: transparent; margin: 0; }
input[type=range].slider::-webkit-slider-runnable-track { height: 8px; border-radius: 99px; background: var(--track, #eee); }
input[type=range].slider::-moz-range-track { height: 8px; border-radius: 99px; background: var(--track, #eee); }
input[type=range].slider::-webkit-slider-thumb { -webkit-appearance: none; width: 30px; height: 30px; border-radius: 50%; background: #fff; border: 3px solid var(--plum); margin-top: -11px; box-shadow: 0 3px 10px rgba(0,0,0,.18); }
input[type=range].slider::-moz-range-thumb { width: 24px; height: 24px; border-radius: 50%; background: #fff; border: 3px solid var(--plum); box-shadow: 0 3px 10px rgba(0,0,0,.18); }
.try .row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
.try .row > div { background: #faf6f4; border-radius: 12px; padding: 9px 10px; }
.try .row .v { font-weight: 750; font-variant-numeric: tabular-nums; }
.try .row .k { font-size: .7rem; color: var(--muted); }
.range-k { display: flex; justify-content: space-between; font-size: .72rem; color: var(--muted); margin-top: -2px; }
.reset { font-size: .8rem; color: var(--pink); background: none; border: 0; font-weight: 700; cursor: pointer; padding: 0; }
.journey { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0; position: relative; margin: 6px 0 0; }
.journey::before { content: ""; position: absolute; left: 14px; right: 14px; top: 13px; height: 2px; background: #eee3df; }
.journey div { position: relative; padding-top: 34px; font-size: .78rem; color: var(--muted); }
.journey div::before { content: ""; position: absolute; top: 5px; left: 5px; width: 18px; height: 18px; border-radius: 50%; background: var(--card); border: 3px solid #e2d6d2; }
.journey div.on::before { border-color: var(--pink); background: var(--pink); }
.journey div.floor::before { border-color: var(--red); }
.journey b { display: block; color: var(--ink); font-size: 1.05rem; font-variant-numeric: tabular-nums; }
.lang { display: inline-flex; background: #efe8e5; border-radius: 10px; padding: 3px; }
.lang button { border: 0; background: none; padding: 5px 11px; border-radius: 8px; font-size: .78rem; font-weight: 700; color: var(--ink-2); cursor: pointer; }
.lang button.on { background: var(--card); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.08); }
.tip { display: grid; grid-template-columns: 28px 1fr; gap: 8px; font-size: .88rem; color: var(--ink-2); padding: 10px 0; border-top: 1px solid var(--line); }
.tip:first-child { border-top: 0; padding-top: 0; }
.warn-card { background: var(--amber-soft); color: #7a4a00; border-radius: 16px; padding: 12px 14px; font-size: .88rem; margin-top: 12px; }
.toast { position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom)); transform: translateX(-50%) translateY(20px); opacity: 0; z-index: 50; background: var(--ink); color: #fff;
  padding: 11px 16px; border-radius: 14px; font-size: .88rem; font-weight: 600; transition: all .25s; pointer-events: none; max-width: 92vw; }
.toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }
.skel { background: linear-gradient(90deg, #f1ebe8, #f8f4f1, #f1ebe8); background-size: 200% 100%; animation: sh 1.2s infinite; border-radius: 16px; }
@keyframes sh { to { background-position: -200% 0; } }
